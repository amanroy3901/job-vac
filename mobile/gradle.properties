# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# Apple targets (iosArm64, iosSimulatorArm64) can only be compiled on macOS. On Linux/Windows Gradle disables them;
# this keeps that silent instead of failing/warning, so Android builds and JVM tests work everywhere.
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Locales shipped in this build (comma-separated). Must match androidApp/src/main/res/xml/locales_config.xml and
# iosApp/iosApp/Info.plist CFBundleLocalizations.
sm.enabledLocales=hi,en

# API base URLs (placeholder domain; docs/api/README.md §1)
sm.apiBaseUrl.prod=https://api.sarkarimatch.in/
sm.apiBaseUrl.staging=https://api-staging.sarkarimatch.in/
