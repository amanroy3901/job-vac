        friends_joined: { type: integer }
        pro_days_earned: { type: integer }
        redeemed_code: { type: [string, 'null'] }

    PushData:
      type: object
      description: |
        Documentation-only schema of the FCM **data** map (every value is a string on the wire; not an HTTP body).
        Canonical channel IDs are the design's (05-notifications §1, seven incl. `family`) and are immutable after
        release. Since 2026-11-19 the server sends only: `sync` (topic `catalog`), `reminder`/`deadline` (topic
        `p_{post_id}`: kinds d_minus_3, d_minus_1, last_day), `lifecycle` (topic `n_{notice_id}`), `account` and
        `family` (one account's devices) and `self_test` (one token). Every other type (match_new, extension,
        corrigendum, cancelled, digest, clash, certificate, snooze/periodic reminders, N-50…N-53 family alerts) is
        **composed on the device** from the catalog and app string resources and never travels over FCM. No text is
        sent: the device renders every template in the app language.
        Device rendering type → channel: match_new → new_match · reminder → reminders · deadline → critical ·
        extension/corrigendum/cancelled/clash/certificate → job_updates (newly eligible after a corrigendum, N-11c →
        new_match) · lifecycle → critical when `critical=1`, else job_updates · digest → digest · account → account ·
        family alerts (on a member's phone) → family · self_test → critical · sync → no notification.
        **iOS (APNs via FCM):** the same data map arrives as custom keys of the APNs payload. sync, account
        `entitlement` and family `sync` are background pushes (content-available); every other server push is an
        alert push with `title-loc-key`/`loc-key` = `push.<type>[.<kind>].title|body` (resolved from the app's
        Localizable.strings — still no server text, except account/family fallback text), `mutable-content: 1` (the
        Notification Service Extension rewrites it from the local catalog), category `MATCH_REMINDER` (actions
        `APPLIED`, `LATER`) for reminder/deadline, `LIFECYCLE`, `SELF_TEST`, and `interruption-level:
        time-sensitive` for `deadline`/`last_day`. Channels are Android-only; iOS maps channel → category/thread.
      required: [type, msg_id]
      properties:
        type:
          type: string
          enum: [match_new, reminder, deadline, extension, corrigendum, cancelled, lifecycle, digest, clash, certificate, account, family, self_test, sync]
          description: 'reminder = periodic / d_minus_3 / snooze_due; deadline = d_minus_1 / last_day. Unknown → sync. (`ping` retired 2026-11-19.)'
        msg_id: { type: string, description: 'Dedupe id. For reminders it equals `reminder_id`; for sync `sync:{seq}`; for lifecycle `l:{event_id}`.' }
        reminder_id: { type: string, examples: ['r:m_01JD3X7Q5M2V8K:d_minus_1:20260731'], description: 'Deterministic `r:{match_id}:{kind}:{YYYYMMDD IST}` with match_id derived from post_id, so the server (which never knows the user) and the device compute the same id; the on-device backup reminder is cancelled when this push is shown.' }
        seq: { type: string, description: 'type=sync: catalog sequence to fetch up to' }
        kind: { $ref: '#/components/schemas/ReminderKind' }
        rank: { type: string, enum: ['1', '2', '3', '4', '5', '6'], description: 'Daily-cap rank (ReminderKind description). The device gate never defers ranks 1–3.' }
        template: { type: string, examples: ['N-04'], description: 'Design template id; the app adds it as `nid` to the deep link for analytics' }
        channel: { type: string, enum: [critical, new_match, reminders, job_updates, digest, account, family], description: 'Android notification channel id. Unknown → reminders.' }
        priority: { type: string, enum: [high, normal] }
        link: { type: string, examples: ['sarkarimatch://job/m_01JD3X7Q5M2V8K?src=push'], description: 'Content-intent deep link (docs/api/README.md §1a)' }
        post_id: { type: string, description: 'Topic pushes carry post_id; the device derives match_id' }
        notice_id: { type: string }
        event_id: { type: string, description: 'Lifecycle event id (lifecycle pushes)' }
        stage: { type: string, examples: ['tier1', 'dv'] }
        critical: { type: string, enum: ['0', '1'] }
        family_link_id: { type: string, description: 'type=family' }
        family_event: { type: string, enum: [sync, accepted, removed, paused, resumed], description: 'type=family: sync → GET the watch-list; accepted → N-44; removed → N-54' }
        device_label: { type: string, description: 'type=account, template N-47: the new alert device' }
        fallback_title: { type: string, description: 'account/family pushes only: server-rendered text (notification_text, device locale + fallback) for app versions that lack the template' }
        fallback_body: { type: string }
        actions: { type: string, examples: ['applied,snooze', 'applied,not_interested', 'open_site,applied', 'view'], description: 'Comma list of buttons: applied (भर दिया), snooze (बाद में), not_interested (रुचि नहीं), open_site (साइट खोलें), view (देखें)' }
        last_date: { type: string, format: date }
        last_date_time: { type: string, examples: ['23:00'] }
        apply_url: { type: string, format: uri, description: 'Official apply URL for "साइट खोलें" (N-05) — opened directly, never through our redirect' }
        pdf_url: { type: string, format: uri, description: 'Official notice PDF' }
        collapse: { type: string, description: 'Notification tag (post_id, or notice_id:stage) so a newer alert replaces the older one' }
        test_id: { type: string, description: 'type=self_test' }
        sync: { type: string, enum: ['0', '1'], description: '1 = also run a catalog sync' }

    CatalogHead:
      type: object
      required: [seq, server_time, snapshot, batches, evaluator_min_version_any]
      properties:
        seq: { type: integer, description: 'Latest published catalog sequence' }
        server_time: { type: string, format: date-time, description: 'Detect device clock skew (> 10 min → schedule with server date)' }
        snapshot:
          type: object
          required: [seq, url, sha256]
          properties:
            seq: { type: integer }
            url: { type: string, description: 'Relative path, e.g. /v1/catalog/snapshots/1234 (append ?locales=)' }
            sha256: { type: object, additionalProperties: { type: string }, description: 'Per normalised locales value, e.g. {"en,hi": "…"}' }
            size_bytes: { type: integer }
        batches:
          type: array
          description: 'Batches after the snapshot, ascending seq (at most 200; older devices load the snapshot)'
          items:
            type: object
            required: [seq, url, sha256]
            properties:
              seq: { type: integer }
              url: { type: string }
              sha256: { type: object, additionalProperties: { type: string } }
              reason: { type: string, enum: [publish, corrigendum, extension, cancel, lifecycle, retract, translation] }
        evaluator_min_version_any: { type: integer, description: 'Highest evaluator_min_version used by any open rule; an app below it shows the update banner' }

    CatalogBatch:
      type: object
      required: [seq, published_at, notices, removed_notice_ids]
      properties:
        seq: { type: integer }
        published_at: { type: string, format: date-time }
        locales: { type: array, items: { $ref: '#/components/schemas/LanguageCode' } }
        notices:
          type: array
          description: Full current version of every notice changed by this publish (replace the local copy).
          items: { $ref: '#/components/schemas/Notice' }
        removed_notice_ids: { type: array, items: { type: string } }

    CatalogSnapshot:
      type: object
      required: [seq, built_at, notices]
      properties:
        seq: { type: integer }
        built_at: { type: string, format: date-time }
        locales: { type: array, items: { $ref: '#/components/schemas/LanguageCode' } }
        notices: { type: array, items: { $ref: '#/components/schemas/Notice' } }

    RuleDocument:
      type: object
      additionalProperties: true
      description: |
        A published eligibility rule: a `docs/backend/rule.schema.json` document (schema_version "1") in its public
        form (no `review`, no `source.quote`). Evaluated ON THE DEVICE by `:matching-core`; never evaluated by the
        server for a user. Text fields are LocalizedText.
      required: [schema_version, post, exam_tags, age, qualification, fees, source]
      properties:
        schema_version: { type: string, const: '1' }
        evaluator_min_version: { type: integer, minimum: 1 }

    LocalProfile:
      type: object
      description: |
        Documentation-only: the eligibility profile as stored ON THE DEVICE (Room) and inside the user's end-to-end
        encrypted backup. It is never sent to the server in clear. `ReportInput.attributes` may carry a subset when
        the user ticks the box for one report.
      required: [dob, gender, category, domicile_state, qualifications, interests]
      properties:
        dob: { type: string, format: date }
        gender:
          type: [string, 'null']
          enum: [male, female, transgender, null]
          description: 'S09 chips पुरुष / महिला / ट्रांसजेंडर. null = skipped ("छोड़ें"): gender-restricted posts become check_yourself.'
        category: { type: string, enum: [gen, ews, obc, sc, st] }
        category_unsure: { type: boolean, default: false, description: 'S07 "पता नहीं": evaluated as gen; reserved-category posts come back as check_yourself (SC-02).' }
        obc_non_creamy_layer: { type: [boolean, 'null'] }
        domicile_state: { type: string }
        pwd:
          type: object
          properties:
            has_benchmark_disability: { type: boolean, default: false }
            type: { type: [string, 'null'] }
        ex_serviceman:
          type: object
          properties:
            is_ex_serviceman: { type: boolean, default: false }
            service_years: { type: [number, 'null'], minimum: 0, maximum: 40 }
            release_date: { type: [string, 'null'], format: date }
        marital_status: { type: [string, 'null'], enum: [unmarried, married, widowed, divorced, null] }
        qualifications:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required: [code, status]
            properties:
              code: { type: string }
              status: { type: string, enum: [completed, final_year, appearing], description: 'S05 "पास हो गया" → completed, "आखिरी साल / रिज़ल्ट बाकी" → final_year' }
              result_date: { type: [string, 'null'], format: date }
              percentage_band: { type: [string, 'null'], enum: [lt_50, '50_55', '55_60', ge_60, null] }
        extra_attributes: { type: array, items: { type: string } }
        certificates:
          type: object
          properties:
            obc_ncl_financial_year: { type: [string, 'null'], pattern: '^\d{4}-\d{2}$' }
            ews_financial_year: { type: [string, 'null'], pattern: '^\d{4}-\d{2}$' }
            domicile_certificate_issued_on: { type: [string, 'null'], format: date }
        interests:
          type: object
          required: [exam_types]
          properties:
            exam_types: { type: array, minItems: 1, items: { type: string } }
            job_states: { type: array, items: { type: string } }
            include_all_india: { type: boolean, default: true }

    ReportInput:
      type: object
      required: [post_id, rule_version, reason]
      properties:
        post_id: { type: string }
        rule_version: { type: integer }
        reason:
          type: string
          enum: [not_eligible_age, not_eligible_qualification, not_eligible_domicile, not_eligible_gender, not_eligible_category, wrong_dates, wrong_fee, wrong_link, duplicate, other]
        rule: { type: [string, 'null'], description: 'RuleExplanation.rule the user disputes' }
        verdict_shown: { $ref: '#/components/schemas/Verdict' }
        comment: { type: [string, 'null'], maxLength: 500 }
        attributes:
          type: [object, 'null']
          additionalProperties: true
          description: 'ONLY with the per-report "send the details needed to check this" tick; only the LocalProfile fields that the disputed rule reads (e.g. dob + category for an age rule). Never in minor mode.'

    UsageCounters:
      type: object
      required: [ist_date, app_version, locale, counters]
      description: 'Opt-in aggregate for one IST day from one install, with NO identifier of the install or user. Values are clamped server-side.'
      properties:
        ist_date: { type: string, format: date }
        app_version: { type: integer }
        locale: { $ref: '#/components/schemas/LanguageCode' }
        counters:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 1000 }
          examples:
            - { onboarding_completed: 1, matches_shown: 4, applied: 1, not_interested: 1, notif_blocked: 0, reminder_shown_push: 2, reminder_shown_backup: 1, report_sent: 0, reason_check_yourself_marks: 1 }

    PushTest:
      type: object
      required: [test_id, status, sent_at]
      properties:
        test_id: { type: string }
        status: { type: string, enum: [sent, received, timeout, fcm_error] }
        sent_at: { type: string, format: date-time }
        received_at: { type: [string, 'null'], format: date-time }
        latency_ms: { type: [integer, 'null'] }
        fcm_error: { type: [string, 'null'], examples: ['UNREGISTERED'] }

    BackupInput:
      type: object
      required: [ciphertext, key_id, format_version]
      properties:
        ciphertext: { type: string, contentEncoding: base64, maxLength: 87400, description: 'AES-256-GCM(nonce ‖ ciphertext ‖ tag) of the app state JSON, ≤ 64 KB raw' }
        key_id: { type: string, description: 'Id of the device-held key in Block Store (not the key)' }
        format_version: { type: integer, minimum: 1 }

    Backup:
      allOf:
        - $ref: '#/components/schemas/BackupInput'
        - type: object
          required: [version, updated_at]
          properties:
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    EncryptedWatchlist:
      type: object
      required: [version, ciphertext]
      description: |
        The aspirant's watch-list for one family link, encrypted on the aspirant's phone with the key from the invite
        URL fragment (AES-256-GCM, AAD = link_id ‖ version). Plaintext (documentation only): {label, relation,
        items: [{post_id, notice_id, short_title: LocalizedText, last_date, last_date_time, kinds: [one_day_before,
        last_day, admit_card, dv_schedule]}]}.
      properties:
        version: { type: integer, minimum: 1 }
        ciphertext: { type: string, contentEncoding: base64, maxLength: 43700 }
        updated_at: { type: string, format: date-time, readOnly: true }

    FamilyInviteInput:
      type: object
      properties:
        relation: { type: string, enum: [parent, sibling, spouse, other], description: 'Shown to the aspirant only (S34); the member sees what the aspirant puts in the encrypted watch-list' }

    FamilyLink:
      type: object
      required: [id, state, created_at]
      properties:
        id: { type: string, examples: ['f_01JD…'] }
        state: { type: string, enum: [invited, active, paused, removed, expired], description: 'paused = owner Pro lapsed' }
        relation: { type: [string, 'null'] }
        invite_url: { type: [string, 'null'], format: uri, description: 'https://sarkarimatch.in/f/{token} (only while invited); the app appends #k=<key> before sharing / drawing the QR' }
        invite_expires_at: { type: [string, 'null'], format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    FamilyInviteView:
      type: object
      required: [link_id, state]
      properties:
        link_id: { type: string }
        state: { type: string, enum: [invited, active, declined, expired, removed] }
        expires_at: { type: [string, 'null'], format: date-time }

    FamilyFollowing:
      type: object
      required: [link_id, state]
      properties:
        link_id: { type: string }
        state: { type: string, enum: [active, paused, removed] }
        watchlist_version: { type: [integer, 'null'] }
        accepted_at: { type: [string, 'null'], format: date-time }
