openapi: 3.1.0
info:
  title: Sarkari Match App API
  version: 1.0.0
  summary: Contract between the Sarkari Match Android and iOS apps (Kotlin Multiplatform) and the backend.
  description: |
    Mobile-facing API, shared by the Android and iOS apps (one Kotlin Multiplatform codebase; founder decision 9).
    Admin/curation, the Play RTDN hook, the App Store Server Notifications hook and scheduler ticks are NOT part of
    this contract (see docs/backend/README.md).

    Founder decisions 2026-11-19 (docs/PRD.md) shape this version:
    - **Privacy-first (ADR-11):** the eligibility profile, matching, matches, reminders, actions, applications and
      inbox live ON THE DEVICE. The server publishes a public, CDN-cached **catalog** (`/v1/catalog/**`) that the
      app evaluates locally. No endpoint accepts a profile.
    - **Login:** Google Sign-In (Firebase Auth Google provider), **Sign in with Apple on iOS** (Firebase Auth
      `apple.com` provider; required by App Store guideline 4.8 when a third-party login is offered) or guest.
      Guests have no server account until a server feature needs one (trial, purchase, family); then Firebase
      anonymous auth, which can later be linked to Google or Apple with the same uid. ID tokens whose
      `firebase.sign_in_provider` is not `anonymous`, `google.com` or `apple.com` are refused. No phone, no OTP.
    - **Payments:** Google Play Billing on Android, StoreKit 2 / App Store in-app purchase on iOS. One server
      entitlement per account across both stores (a user moving between platforms keeps Pro).
      **No WhatsApp, no SMS.** Delivery = FCM (topics + account pushes; APNs via FCM on iOS) + on-device reminders.
    - **Languages:** content is `LocalizedText` over 13 Indian languages; hi + en are enabled at launch.

    Conventions (details in docs/api/README.md):
    - Auth: `Authorization: Bearer <Firebase ID token>` on `/v1/me/**`, `/v1/session`, `/v1/family/**` and family
      accept, plus `X-Firebase-AppCheck: <App Check token>` (Play Integrity on Android, App Attest on iOS) on every
      non-public call.
      Catalog, config, reference and health are public CDN files (no auth).
    - Every API request sends `X-App-Version` (versionCode) and `Accept-Language` (one of the 13 codes, e.g.
      `hi`, `ta`, `ur`; it selects `Problem.message`). `X-Installation-Id` is sent only on account calls.
    - Errors are RFC 9457 `application/problem+json` with a stable machine `code`.
    - Every mutating request carries `Idempotency-Key` (UUIDv4, generated once per user intent and
      reused on retry). Replays within 24 h return the original response with `Idempotent-Replayed: true`.
    - Timestamps are RFC 3339 with offset (`2026-08-01T09:00:00+05:30`); calendar dates (`format: date`)
      are Indian Standard Time calendar dates.
    - User-visible strings arrive as `LocalizedText` maps (`en` always present, plus the requested languages).
    - The catalog is delta-synced by sequence number (`/v1/catalog/head` → snapshot → batches).
    - Additive changes only within v1: clients MUST ignore unknown fields and treat unknown enum
      values as the documented fallback (`other`/`unknown`).
    - Canonical identifiers (docs/contract-alignment.md): `notice_id` (`n_…`, one advertisement, shared),
      `post_id` (`p_…`, one post inside a notice = "the job", shared), `match_id` (`m_…`, derived ON THE DEVICE as
      `m_` + the post id without `p_`; never issued by the server), `application_id` (`a_…`, derived the same way,
      `a_` + post suffix). The design's `jobId` route argument is `match_id`.
  contact:
    name: Sarkari Match backend
servers:
  - url: https://api.sarkarimatch.in
    description: Production (Cloud Run, asia-south1) — placeholder domain
  - url: https://api-staging.sarkarimatch.in
    description: Staging
security:
  - firebaseIdToken: []
    appCheck: []
tags:
  - name: config
  - name: catalog
  - name: session
  - name: reference
  - name: notices
  - name: quality
  - name: devices
  - name: backup
  - name: entitlements
  - name: family
  - name: account
  - name: referral

paths:
  /v1/config:
    get:
      tags: [config]
      operationId: getAppConfig
      summary: App configuration, force/soft update, feature flags, kill switches.
      description: Public (CDN, no auth). Cacheable; honour ETag.
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/health:
    get:
      tags: [config]
      operationId: getHealth
      summary: Lightweight service status for the outage banner/screen (S42/O03). No auth, CDN-cached 30 s.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [up, degraded, down] }
                  message: { $ref: '#/components/schemas/LocalizedText' }
                  alerts_delayed: { type: boolean, description: 'true when catalog publishing or topic pushes are behind (e.g. FCM outage); on-device reminders are unaffected' }

  /v1/catalog/head:
    get:
      tags: [catalog]
      operationId: getCatalogHead
      summary: Current catalog sequence, snapshot and batch list. Public, CDN-cached 60 s. The app's only input for on-device matching.
      description: |
        Founder decisions 2026-11-19 / ADR-11: eligibility is evaluated on the phone against this public catalog; no
        profile is ever sent. Fetch on the `catalog` topic push (`type=sync`), on app start (debounced) and in the
        daily reconcile worker. If `local_seq < snapshot.seq` or the local catalog is empty, load the snapshot; then
        apply every batch with `seq > local_seq` in order, each in one Room transaction, verifying `sha256`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogHead' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/catalog/snapshots/{seq}:
    get:
      tags: [catalog]
      operationId: getCatalogSnapshot
      summary: Full catalog as of `seq` (open, upcoming, recently closed notices and notices with recent lifecycle events). Immutable, CDN-cached.
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogSeq'
        - $ref: '#/components/parameters/Locales'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSnapshot' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/catalog/batches/{seq}:
    get:
      tags: [catalog]
      operationId: getCatalogBatch
      summary: The notices changed by one publish (full new versions) and removed notice ids. Immutable, CDN-cached.
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogSeq'
        - $ref: '#/components/parameters/Locales'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogBatch' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/notices/{notice_id}:
    get:
      tags: [notices]
      operationId: getNotice
      summary: One notice as in the catalog (posts with public rules, dates, fees, documents, lifecycle). Public, CDN-cacheable. Used for shared `/p/{post_id}` links to notices no longer in the local catalog.
      security: []
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Locales'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/reference:
    get:
      tags: [reference]
      operationId: getReferenceBundle
      summary: All reference data in one bundle (languages, qualifications taxonomy, categories, states, exam types, PwD types, extra attributes, organisations).
      description: Large-ish (~40 KB gzipped), changes rarely. Cache in Room; revalidate with If-None-Match daily or when `AppConfig.reference_version` changes.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceBundle' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/session:
    post:
      tags: [session]
      operationId: startSession
      summary: Bootstrap an account after Firebase sign-in (Google, Apple on iOS, or anonymous when a guest first needs a server feature). Creates the account on first call.
      description: |
        Guests who use only free matching and reminders never call this: they have no server account (ADR-11).
        After Sign in with Apple, send `apple_authorization_code` once so the server can revoke the Apple tokens when
        the account is deleted (App Store guideline 5.1.1(v)).
        Call after a fresh Firebase sign-in, after `linkWithCredential` (guest → Google/Apple, same uid), and at most once
        per app start for accounts. Idempotent per Firebase UID. Signing in with a Google account that already has
        an account returns that account (`is_new_user=false`, `has_backup` tells the app whether to offer restore /
        the D10 profile-conflict choice). Never called in minor mode.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Summary of everything the server holds about this account (DPDP access right; the profile is on the phone).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Request account deletion (DPDP Act right to erasure). The app wipes local data separately.
      description: |
        Ends family links, removes devices and the backup, and hard-deletes the account within 7 days (grace period
        during which `POST /v1/me/deletion:cancel` restores it). Play and App Store subscriptions are NOT cancelled
        by this call; the client must show `Entitlement.manage_url` (Play subscriptions, or the App Store's
        subscription sheet when `Entitlement.platform=ios`) if the entitlement comes from a store.
        **Sign in with Apple (guideline 5.1.1(v)):** the server revokes the user's Apple refresh token (stored from
        `SessionRequest.apple_authorization_code`, or exchanged from `apple_authorization_code` sent here).
        `DeletionStatus.apple_revocation=token_missing` means the server has neither: run Sign in with Apple again
        and repeat the call with the new code.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [too_many_alerts, wrong_matches, got_job, privacy, other]
                comment: { type: string, maxLength: 500 }
                apple_authorization_code: { type: string, description: 'iOS: a fresh ASAuthorizationAppleIDCredential.authorizationCode (valid 5 min) when the server holds no Apple token (apple_revocation=token_missing)' }
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/deletion:cancel:
    post:
      tags: [account]
      operationId: cancelDeletion
      summary: Cancel a pending deletion during the grace period.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deletion cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/consents:
    get:
      tags: [account]
      operationId: listConsents
      summary: Current state of the account-level consent purposes (privacy notice version, cloud backup, family link).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [account]
      operationId: recordConsent
      summary: Grant or withdraw an account-level consent (append-only log server side). Device-only choices are never sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/reports:
    post:
      tags: [quality]
      operationId: reportMatch
      summary: Anonymous wrong-match / wrong-data report (B05). No account needed; no user id is stored.
      description: |
        `attributes` (the minimal profile fields needed to re-check the rule) are sent ONLY when the user ticks "send
        the details needed to check this" for this report, and never in minor mode. Requires a limited-use App Check token.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchReport' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telemetry:
    post:
      tags: [quality]
      operationId: postUsageCounters
      summary: Opt-in, identifier-free daily usage counters (no user, install or device id). Never sent in minor mode.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageCounters' }
      responses:
        '204':
          description: Accepted
        default: { $ref: '#/components/responses/Problem' }

  /v1/push-tests:
    post:
      tags: [devices]
      operationId: startPushTest
      summary: Delivery self-test (S16, S29). Sends one high-priority `type=self_test` message to the given FCM token. No account needed.
      description: The token is stored encrypted only until the test ends (≤ 120 s), then erased.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token: { type: string }
                kind: { type: string, enum: [immediate, killed_app], default: immediate }
                delay_seconds: { type: integer, minimum: 0, maximum: 120, default: 0, description: 'killed_app: send after the user swipes the app away' }
      responses:
        '202':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushTest' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/push-tests/{test_id}:
    get:
      tags: [devices]
      operationId: getPushTest
      summary: Poll a self-test (`received` or `timeout` at 120 s). Advice is computed on the device from its own state.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushTest' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/push-tests/{test_id}:received:
    post:
      tags: [devices]
      operationId: ackPushTest
      summary: Called from `onMessageReceived` (expedited work) when the test message arrives.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '204':
          description: Recorded
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Installs signed in to this account (S38 "linked devices").
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/devices/{installation_id}:
    put:
      tags: [devices]
      operationId: upsertDevice
      summary: Register/refresh this install for account pushes (trial/Pro/family). Accounts only; call on sign-in, `onNewToken` and locale change.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Unregister on sign-out.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/devices/{installation_id}:make-primary:
    post:
      tags: [devices]
      operationId: makeDevicePrimary
      summary: Make this install the account's alert device (B15). Other installs of the account get N-47 (`account` push) and go quiet (keep data, stop local reminders, unsubscribe deadline/lifecycle topics). Guests have one install and never call this.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/backup:
    get:
      tags: [backup]
      operationId: getBackup
      summary: The account's end-to-end-encrypted backup (opt-in). Requires a Google-linked account. 404 when none.
      description: |
        The blob is the app's local state (profile, matches' statuses, applications, prefs, device consent choices)
        encrypted on the device (AES-256-GCM) with a key kept in Google Block Store (`shouldBackupToCloud`). The
        server cannot read it. Used for restore on a new phone and the D10 profile-conflict choice.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [backup]
      operationId: putBackup
      summary: Replace the backup (compare-and-swap with If-Match; 412 `backup_conflict` when another device wrote first).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          description: ETag (version) of the backup this write is based on; omit only for the first write.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupInput' }
      responses:
        '200':
          description: Stored
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [backup]
      operationId: deleteBackup
      summary: Turn backup off and erase the blob.
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Problem' }

  /v1/products:
    get:
      tags: [entitlements]
      operationId: listProducts
      summary: Plan catalogue (ids map to Play product/base plan ids and App Store product ids). Prices MUST be shown from Play Billing ProductDetails / StoreKit Product.displayPrice, not from here.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/entitlement:
    get:
      tags: [entitlements]
      operationId: getEntitlement
      summary: The single source of truth for Pro access, with a signed `token` for offline gating and lifecycle-topic subscription. Re-fetch on app start (accounts only), after any purchase and on an `account` push with template `entitlement`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/trial:
    post:
      tags: [entitlements]
      operationId: startTrial
      summary: Start the 14-day Pro trial when the user taps the trial CTA (B02 after the first Applied, or S30). 409 `trial_already_used`.
      description: |
        The trial is offered on the device at the first Applied (B02, while `Entitlement.trial_available`) and starts
        only on this call; it runs 14 days from the tap. No payment method is needed (server-granted, not a Play
        offer). A guest without an account first signs in (B16 `pro`) or gets an anonymous account. The app then
        subscribes lifecycle topics for its existing applications. Not available in minor mode.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/purchases:
    get:
      tags: [entitlements]
      operationId: listPurchases
      summary: Receipt list for "Manage plan" (S32). No purchase tokens are returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/purchases/google-play:
    post:
      tags: [entitlements]
      operationId: verifyPlayPurchase
      summary: Verify a Play Billing purchase server-side; server acknowledges it and grants the entitlement.
      description: |
        Call from `PurchasesUpdatedListener` and for every unacknowledged purchase found by `queryPurchasesAsync`
        on app start. The client must NOT call `acknowledgePurchase` itself (server acknowledges). Launch the
        billing flow with `setObfuscatedAccountId(User.billing_account_ref)`. 409 `purchase_owned_by_other_account`
        when the token is linked to a different active account ("sign in with the Google account you used then").
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayPurchaseInput' }
      responses:
        '200':
          description: Verified (or already verified)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '402': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/purchases/app-store:
    post:
      tags: [entitlements]
      operationId: verifyAppStorePurchase
      summary: Verify a StoreKit 2 transaction (iOS) server-side and grant the entitlement.
      description: |
        Call after `Product.purchase()` returns `.success(.verified)`, for every transaction from
        `Transaction.updates` and, on app start / "restore", for every `Transaction.currentEntitlements` entry
        (send `VerificationResult.jwsRepresentation`). Call `transaction.finish()` only after a 200 (or a 402
        `purchase_invalid`, which will never succeed). Purchase with `.appAccountToken(UUID(User.billing_account_ref))`.
        The server verifies the JWS x5c chain to Apple Root CA - G3, the bundle id and environment (Sandbox is
        accepted and flagged as a test purchase: App Review buys in Sandbox). 409 `purchase_owned_by_other_account`
        when the subscription is linked to a different active account. Products: `pro_year` = auto-renewable (14-day
        introductory free trial set in App Store Connect), `pro_season` = non-renewing subscription (4 months from
        purchase, stacked after any remaining season time).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppStorePurchaseInput' }
      responses:
        '200':
          description: Verified (or already verified)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '402': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/referral:
    get:
      tags: [referral]
      operationId: getReferral
      summary: My invite code, share link and rewards earned (+1 month Pro per friend who completes a profile).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/referral:redeem:
    post:
      tags: [referral]
      operationId: redeemReferral
      summary: Redeem a friend's code (once per account, within 7 days of sign-up).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-Z0-9]{6,10}$' }
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/family-invites/{token}:
    get:
      tags: [family]
      operationId: getFamilyInvite
      summary: Family member side (S35) — state of an invite. The token comes from the App Link or QR; the decryption key in the URL fragment is never sent.
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyInviteView' }
        '410': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/family-invites/{token}:accept:
    post:
      tags: [family]
      operationId: acceptFamilyInvite
      summary: Accept as family member. Needs an account (Google or anonymous); no phone, no OTP. Alerts go to this app as push.
      parameters:
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version: { type: string, description: 'S47 privacy notice version shown on S35 (recorded as family_link_member)' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyFollowing' }
        '410': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/family-invites/{token}:decline:
    post:
      tags: [family]
      operationId: declineFamilyInvite
      security:
        - appCheck: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '204':
          description: Declined
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/family:
    get:
      tags: [family]
      operationId: listFamily
      summary: (Pro, P1) Aspirant side (S34/S48) — my family links (max 2).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, max]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FamilyLink' }
                  max: { type: integer, examples: [2] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [family]
      operationId: inviteFamily
      summary: (Pro) Create an invite link. The app appends `#k=<key>` (generated on the device) and shares it via the sharesheet or a QR (S48).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyInviteInput' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/family/{link_id}:
    delete:
      tags: [family]
      operationId: removeFamily
      summary: Aspirant ends a link (D06). The member gets a `family_removed` account push.
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/family/{link_id}/watchlist:
    put:
      tags: [family]
      operationId: putFamilyWatchlist
      summary: (Pro) Publish the encrypted watch-list for one link. The server stores only the latest version and pushes `family_sync` to the member.
      parameters:
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EncryptedWatchlist' }
      responses:
        '204':
          description: Stored
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/family/following:
    get:
      tags: [family]
      operationId: listFollowing
      summary: Family member side (S49) — links where I receive someone's alerts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FamilyFollowing' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/family/following/{link_id}:
    delete:
      tags: [family]
      operationId: stopFollowing
      summary: Family member stops getting the aspirant's alerts (D12).
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: Stopped
        default: { $ref: '#/components/responses/Problem' }

  /v1/family/following/{link_id}/watchlist:
    get:
      tags: [family]
      operationId: getFamilyWatchlist
      summary: Family member fetches the latest encrypted watch-list (after a `family_sync` push), decrypts it with the key from the invite URL fragment, subscribes topics and schedules local alarms.
      parameters:
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncryptedWatchlist' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Auth ID token (provider google.com, apple.com or anonymous; others → 401). Refresh via Firebase SDK; on 401 `token_expired` refresh once and retry.
    appCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Firebase App Check token (Play Integrity provider on Android, App Attest provider with DeviceCheck fallback on iOS; debug provider in debug builds).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4 created once per user intent and reused on every retry of it. Stored 24 h.
      schema: { type: string, format: uuid }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: App build number (Android versionCode; on iOS the same integer as CFBundleVersion — both platforms share one build-number sequence so AppConfig.min_supported_version applies to both). Sent on every request (listed here where it changes the response).
      schema: { type: integer }
    NoticeId:
      name: notice_id
      in: path
      required: true
      schema: { type: string }
    CatalogSeq:
      name: seq
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Locales:
      name: locales
      in: query
      required: false
      description: 'Comma-separated LanguageCode list (the app language + its fallbacks). The server normalises it (sorted, `en` always added) so the CDN keeps one copy per set. Default: from Accept-Language, else `hi,en`.'
      schema: { type: string, examples: ['hi,en', 'en,ta', 'en,hi,ur'] }
    TestId:
      name: test_id
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      description: Family invite token from `https://sarkarimatch.in/f/{token}` (the `#k=` fragment is never sent).
      schema: { type: string }
    LinkId:
      name: link_id
      in: path
      required: true
      schema: { type: string }
    InstallationId:
      name: installation_id
      in: path
      required: true
      description: Firebase Installations ID of this app install.
      schema: { type: string }

  headers:
    ETag:
      description: Strong validator; send back in If-None-Match / If-Match.
      schema: { type: string }
    CacheControl:
      schema: { type: string, examples: ['public, max-age=300, stale-while-revalidate=86400'] }
    RetryAfter:
      schema: { type: integer }

  responses:
    NotModified:
      description: Not modified (ETag matched)
    Problem:
      description: Error (RFC 9457)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ['https://api.sarkarimatch.in/problems/pro_required'] }
        title: { type: string, description: English, for logs. Show `message` to users. }
        status: { type: integer }
        code:
          type: string
          description: |
            Stable machine code. Known values: unauthenticated, token_expired, app_check_failed,
            upgrade_required, forbidden, pro_required, google_link_required (= Google or Apple sign-in required),
            not_found, validation_failed,
            idempotency_key_reused, rate_limited, backup_conflict, trial_already_used, purchase_invalid,
            purchase_pending, purchase_owned_by_other_account, family_limit_reached, invite_expired,
            account_pending_deletion, maintenance, internal. Unknown codes: treat by HTTP status.
        message: { $ref: '#/components/schemas/LocalizedText', description: 'In the Accept-Language language (+ en)' }
        detail: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        errors:
          type: array
          description: Field errors for validation_failed.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, examples: ['qualifications[0].code'] }
              code: { type: string, examples: ['unknown_code', 'out_of_range', 'required'] }
              message: { $ref: '#/components/schemas/LocalizedText' }
        details:
          type: object
          additionalProperties: true

    LocalizedText:
      type: object
      description: |
        Text per BCP-47 language code. The 13 supported codes are as, bn, en, gu, hi, kn, ml, mr, or, pa, ta, te, ur
        (ur is right-to-left). `en` is always present; every language whose `ReferenceBundle.languages[].status` is
        `enabled` is present on published content (hi + en at launch). Catalog files contain only the languages
        requested with `?locales=` (plus `en`). Clients resolve with `languages[].fallback` (e.g. mr → hi → en).
      required: [en]
      minProperties: 1
      additionalProperties: false
      properties:
        as: { type: string }
        bn: { type: string }
        en: { type: string }
        gu: { type: string }
        hi: { type: string }
        kn: { type: string }
        ml: { type: string }
        mr: { type: string }
        or: { type: string }
        pa: { type: string }
        ta: { type: string }
        te: { type: string }
        ur: { type: string }

    LanguageCode:
      type: string
      enum: [hi, en, bn, mr, te, ta, gu, kn, or, ml, pa, as, ur]
      description: 'App/content language. Unknown → en.'

    Language:
      type: object
      required: [code, name_native, script, rtl, status, fallback]
      properties:
        code: { $ref: '#/components/schemas/LanguageCode' }
        name_native: { type: string, examples: ['हिन्दी', 'தமிழ்', 'اردو'] }
        script: { type: string, description: 'ISO 15924 (Deva, Latn, Beng, Telu, Taml, Gujr, Knda, Orya, Mlym, Guru, Arab); drives the font chain (design tokens font.script.*)' }
        rtl: { type: boolean }
        status:
          type: string
          enum: [enabled, coming_soon]
          description: 'enabled = selectable in S02/S40 (hi, en at launch) and present on all published content; coming_soon = listed as "जल्द आ रही हैं". Unknown → coming_soon.'
        fallback:
          type: array
          description: 'Resolution order after the language itself, e.g. mr → [hi, en], ta → [en, hi].'
          items: { $ref: '#/components/schemas/LanguageCode' }

    Money:
      type: object
      required: [amount_paise, currency]
      properties:
        amount_paise: { type: integer, minimum: 0, description: 'Integer paise. ₹100 = 10000.' }
        currency: { type: string, const: INR }

    Link:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [official_pdf, apply, official_site, admit_card, result, answer_key, other] }
        url: { type: string, format: uri }
        label: { $ref: '#/components/schemas/LocalizedText' }
        page: { type: [integer, 'null'], description: 'PDF page the fact comes from (provenance)' }

    AppConfig:
      type: object
      required: [min_supported_version, latest_version, update, reference_version, features, support, privacy_notice_version]
      properties:
        min_supported_version: { type: integer, description: 'Below this: blocking update screen (code upgrade_required on all calls).' }
        latest_version: { type: integer }
        update:
          type: string
          enum: [none, soft, force]
        reference_version: { type: string, description: 'Compare with cached ReferenceBundle.version' }
        features:
          type: object
          description: Remote flags. Unknown keys ignored.
          additionalProperties: { type: boolean }
          examples:
            - { paywall_enabled: true, family_alerts: false, clash_alerts: false, digest: true, ads: true, cloud_backup: true, usage_counters_prompt: true }
        kill_switches:
          type: object
          additionalProperties: { type: boolean }
        ads:
          type: object
          description: |
            Global ad settings (free tier light ads, PRD 2026-11-19). The client shows an ad only when
            `config.ads.enabled && entitlement.ads_enabled` and the placement is listed here. Setting
            `enabled=false` is the remote kill switch (takes effect on next config fetch, cached ≤ 15 min).
          required: [enabled, placements]
          properties:
            enabled: { type: boolean }
            placements:
              type: array
              description: 'Only these two exist. Never in pushes, the what-you-need card or why-you-match.'
              items: { type: string, enum: [feed_bottom, digest] }
            min_app_version: { type: [integer, 'null'], description: 'Disable ads on older builds (e.g. a bad SDK version)' }
            frequency:
              type: object
              properties:
                max_per_screen: { type: integer, default: 1 }
                hide_on_first_sessions: { type: integer, default: 3, description: 'No ads in the first N sessions after install (onboarding trust)' }
            blocked_categories:
              type: array
              description: 'AdMob sensitive/general categories the app must also block client-side if the SDK supports it (informational; primary blocking is in the AdMob console)'
              items: { type: string }
        maintenance:
          type: [object, 'null']
          properties:
            message: { $ref: '#/components/schemas/LocalizedText' }
            until: { type: string, format: date-time }
        support:
          type: object
          properties:
            email: { type: string }
            grievance_officer: { type: string, description: 'DPDP grievance contact shown in S47/S39' }
            privacy_policy_url: { type: string, format: uri }
            terms_url: { type: string, format: uri }
        disclaimer:
          $ref: '#/components/schemas/LocalizedText'
        oem_guides:
          type: object
          description: Per-manufacturer (lowercase Build.MANUFACTURER) autostart/battery instructions, optional server override of bundled ones.
          additionalProperties:
            type: object
            properties:
              steps: { type: array, items: { $ref: '#/components/schemas/LocalizedText' } }
              intent_actions: { type: array, items: { type: string } }
        self_test_interval_days: { type: integer, default: 7 }
        privacy_notice_version: { type: string, examples: ['2026-11-19'], description: 'Current S47 notice version; the app re-shows S47 when its stored privacy_notice_ack.version differs' }
        entitlement_token_jwks:
          type: object
          additionalProperties: true
          description: 'Public key set (ES256) to verify Entitlement.token offline'
        reminder_backup:
          type: object
          description: 'Server topic-push times for R3/R1/R-last (IST) so the on-device backup can be scheduled after them (design 05 §3.6)'
          properties:
            d_minus_3: { type: string, default: '19:00' }
            d_minus_1: { type: string, default: '19:00' }
            last_day: { type: string, default: '08:00' }
            backup_delay_minutes: { type: object, additionalProperties: { type: integer }, examples: [ { d_minus_1: 30, last_day: 15 } ] }

    SessionRequest:
      type: object
      required: [installation_id, locale]
      properties:
        installation_id: { type: string }
        locale: { $ref: '#/components/schemas/LanguageCode' }
        privacy_notice_version: { type: string, description: 'S47 version the user acknowledged (recorded once as consent purpose privacy_notice)' }
        referral_code: { type: [string, 'null'] }
        merge_anonymous_id_token: { type: [string, 'null'], description: 'Google sign-in collided with an existing account (FirebaseAuthUserCollisionException) while this phone had an anonymous account: send that account''s last ID token; the server moves its entitlement grants, purchases and family links to the signed-in account and deletes it.' }
        device: { $ref: '#/components/schemas/DeviceInput' }
        apple_authorization_code: { type: [string, 'null'], description: 'iOS, right after Sign in with Apple: ASAuthorizationAppleIDCredential.authorizationCode (single use, 5 min). Exchanged for a refresh token that is revoked when the account is deleted (App Store guideline 5.1.1(v)). A failed exchange never fails the session.' }

    SessionResponse:
      type: object
      required: [user, is_new_user, entitlement, has_backup]
      properties:
        user: { $ref: '#/components/schemas/User' }
        is_new_user: { type: boolean }
        entitlement: { $ref: '#/components/schemas/Entitlement' }
        has_backup: { type: boolean, description: 'An encrypted backup exists. If this phone also has a local profile, show D10 (keep the saved profile = restore the backup, or keep this phone''s = overwrite the backup).' }
        backup_updated_at: { type: [string, 'null'], format: date-time }
        primary_installation_id: { type: [string, 'null'], description: 'The account''s current alert device (B15/N-47)' }

    User:
      type: object
      required: [id, created_at, locale, auth_provider, billing_account_ref]
      description: 'Everything the server holds about an account (GET /v1/me is the DPDP access summary). No profile, no phone.'
      properties:
        id: { type: string, examples: ['u_01JD3X5ZQ7'] }
        created_at: { type: string, format: date-time }
        locale: { $ref: '#/components/schemas/LanguageCode' }
        auth_provider: { type: string, enum: [anonymous, google, apple], description: 'anonymous = guest who bought/joined without signing in; nudge B16 to link Google (or Apple on iOS). The first linked provider is kept.' }
        google_email: { type: [string, 'null'], description: 'Shown in S26/S38 from the Firebase token; not stored in our database' }
        billing_account_ref: { type: string, format: uuid, description: 'Opaque UUID: Play BillingFlowParams.setObfuscatedAccountId on Android, StoreKit Product.PurchaseOption.appAccountToken on iOS' }
        devices_count: { type: integer }
        backup: { type: [object, 'null'], properties: { version: { type: integer }, updated_at: { type: string, format: date-time }, size_bytes: { type: integer } } }
        family_links_count: { type: integer }
        consents: { type: array, items: { $ref: '#/components/schemas/Consent' } }
        deletion: { $ref: '#/components/schemas/DeletionStatus' }

    DeletionStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [none, pending, deleted] }
        hard_delete_at: { type: [string, 'null'], format: date-time }
        apple_revocation: { type: string, enum: [queued, token_missing], description: 'DELETE /v1/me only, for accounts that used Sign in with Apple: queued = Apple token revocation is running; token_missing = send a fresh apple_authorization_code' }

    Consent:
      type: object
      required: [purpose, version, granted, recorded_at]
      description: 'Account-level purposes only. Device-only choices (crash reports, usage counters, ads notice seen, notification explanation seen) are kept on the phone.'
      properties:
        purpose:
          type: string
          enum: [privacy_notice, cloud_backup, family_link_owner, family_link_member]
        version: { type: string, examples: ['2026-11-19'] }
        granted: { type: boolean }
        recorded_at: { type: string, format: date-time }

    ConsentInput:
      type: object
      required: [purpose, version, granted]
      properties:
        purpose: { type: string, enum: [privacy_notice, cloud_backup, family_link_owner, family_link_member] }
        version: { type: string }
        granted: { type: boolean }
        notice_language: { $ref: '#/components/schemas/LanguageCode' }

    ReferenceBundle:
      type: object
      required: [version, languages, qualifications, categories, states, exam_types, pwd_types, extra_attributes]
      properties:
        version: { type: string }
        languages:
          type: array
          description: 'All 13 languages with status (S02/S40 list enabled ones; the rest as "जल्द आ रही हैं")'
          items: { $ref: '#/components/schemas/Language' }
        code_map:
          type: object
          additionalProperties: { type: string }
          description: 'Renamed/merged taxonomy codes (old → new); the app migrates the local profile on load'
        qualifications:
          type: array
          description: Taxonomy tree; `level` orders education levels so "graduate in any discipline" includes all graduate codes.
          items: { $ref: '#/components/schemas/QualificationNode' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/RefItem' }
          description: 'gen, ews, obc, sc, st (+ state-specific sub-categories later)'
        states:
          type: array
          items: { $ref: '#/components/schemas/RefItem' }
          description: 'ISO 3166-2:IN suffix codes: UP, BR, RJ, MP, DL ...'
        pinned_states:
          type: array
          description: 'Launch states shown first in S08 (working assumption ["UP", "BR"]); server-controlled so a launch-state change needs no app release.'
          items: { type: string }
