<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarkari Match — directions overview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0&display=block" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{padding:48px;min-width:1700px}
button{font:inherit;color:inherit;border:0;background:none}
.ms{font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';flex-shrink:0;user-select:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.grid{display:grid;grid-template-columns:repeat(4,376px);gap:48px 40px}
.fr{display:flex;flex-direction:column;gap:14px}
.fr figcaption{font:500 14px/20px 'Inter',system-ui,sans-serif;opacity:.8}
.ph{width:376px;height:816px;border-radius:44px;padding:8px;display:flex;flex-direction:column;overflow:hidden;background:#0D0D0F;box-shadow:0 30px 60px -20px rgba(20,16,10,.35),0 0 0 1px rgba(0,0,0,.25)}
.ph>*{flex-shrink:0;width:360px}
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;font:500 12px/1 Roboto,'Inter',system-ui,sans-serif;border-radius:36px 36px 0 0}
.sb .ms{font-size:15px;margin-left:3px}
.scr{height:748px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.gb{height:24px;display:flex;align-items:center;justify-content:center;border-radius:0 0 36px 36px}
.gb i{display:block;width:108px;height:4px;border-radius:2px}
.fill{flex:1;min-height:0;overflow:hidden;position:relative}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.nw{white-space:nowrap}
/* header strip */
.hd{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px;margin-bottom:48px;padding:40px;border-radius:28px;width:1624px}
.hd h1{font-size:44px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.02em}
.hd .kicker{font:600 12px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.hd .mood{font-size:18px;line-height:1.5;max-width:560px;opacity:.9}
.hd h3{font:600 11px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;opacity:.6}
.hd p,.hd li{font-family:'Inter',system-ui,sans-serif}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.sw div{width:84px}
.sw i{display:block;height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.sw span{display:block;font:500 11px/1.35 ui-monospace,Menlo,monospace;margin-top:6px;opacity:.85}
.sw span b{font:600 11px/1.35 'Inter',system-ui,sans-serif;display:block;opacity:1}
.traits{font-size:15px;line-height:1.55;padding-left:18px;margin-top:20px}
.traits li{margin-bottom:6px}
.fontrow{margin-bottom:16px}
.fontrow .spec{font:500 12px/1.4 'Inter',system-ui,sans-serif;opacity:.65;margin-top:2px}
.langhd{font:600 13px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 20px;opacity:.6}
.langblock{margin-bottom:56px}
body.only-en .langblock.hi, body.only-hi .langblock.en{display:none}
.toggle{position:fixed;top:12px;right:12px;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.7);z-index:9}
.toggle button{color:#fff;font:600 12px/1 'Inter',system-ui,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
body.shot .toggle{display:none}

body.dir-a{background:#E9E5DE;color:#1B1A17;font-family:Inter,'Noto Sans Devanagari',sans-serif}
.dir-a .hd{background:#F6F3EE;box-shadow:0 1px 2px rgba(70,50,20,.06),0 12px 32px rgba(70,50,20,.08)}
.dir-a .ph [lang],.dir-a .ph{font-family:Inter,'Noto Sans Devanagari',sans-serif}
.dir-a .ph[lang=hi]{font-family:'Noto Sans Devanagari',Inter,sans-serif}
.dir-a .ms{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
.dir-a .ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ph.light{--bg:#F6F3EE;--card:#FFFFFF;--ink:#1B1A17;--mut:#6B655C;--hair:#E8E2D8;--sunk:#EFEBE4;--acc:#C2381F;--accC:#FBE7E1;--onAccC:#9C2A14;--ok:#2F6B4F;--okC:#E5F0E9;--q:#8A5A00;--qC:#F6ECD6;--brass:#9A7537;--cta:#1B1A17;--onCta:#FFFFFF;--sh:0 1px 2px rgba(70,50,20,.06),0 8px 24px rgba(70,50,20,.07);--pro:#1B1A17;--onPro:#F3EFE8;--proMut:#B9B1A4;--glass:rgba(246,243,238,.86)}
.ph.dark{--bg:#12110F;--card:#1C1A17;--ink:#F3EFE8;--mut:#A9A196;--hair:#2E2B27;--sunk:#24211D;--acc:#FF8065;--accC:#3A1F18;--onAccC:#FFC2B3;--ok:#8CCBAA;--okC:#1B2E24;--q:#E8C06A;--qC:#33280F;--brass:#D9B77A;--cta:#F3EFE8;--onCta:#1B1A17;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);--pro:#26231F;--onPro:#F3EFE8;--proMut:#B9B1A4;--glass:rgba(18,17,15,.86)}
.dir-a .sb,.dir-a .gb{background:var(--bg);color:var(--ink)}
.dir-a .gb i{background:var(--ink);opacity:.35}
.dir-a .scr{background:var(--bg);color:var(--ink)}
.dir-a .t32{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.02em}
.dir-a .ph[lang=hi] .t32{font-size:28px;line-height:42px;letter-spacing:0}
.dir-a .t17{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.dir-a .ph[lang=hi] .t17{line-height:27px;letter-spacing:0}
.dir-a .t15{font-size:15px;line-height:22px}
.dir-a .ph[lang=hi] .t15{line-height:24px}
.dir-a .t13{font-size:13px;line-height:18px}
.dir-a .ph[lang=hi] .t13{line-height:21px}
.dir-a .b{font-weight:600}
.dir-a .mut{color:var(--mut)}
.dir-a .pad{padding:0 20px}
/* top bar */
.dir-a .tb{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px}
.dir-a .ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;position:relative;color:var(--ink)}
.dir-a .ib.c i{position:absolute;inset:4px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.dir-a .ib .ms{position:relative}
.dir-a .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--bg)}
.dir-a .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#D8C7A8,#9A7537);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px}
/* summary */
.dir-a .sum{display:flex;gap:8px;margin:16px 20px 8px}
.dir-a .sum div{flex:1;border-radius:16px;padding:10px 12px;background:var(--card);box-shadow:var(--sh)}
.dir-a .sum b{display:block;font-size:22px;line-height:28px;font-weight:600}
.dir-a .sum .today{background:var(--acc);color:#fff}
.dir-a .ph.dark .sum .today{color:#1B1A17}
.dir-a .sum span{font-size:13px;line-height:18px}
/* section header */
.dir-a .sh{display:flex;align-items:center;gap:6px;padding:20px 20px 10px;color:var(--mut)}
.dir-a .sh .ms{font-size:18px}
.dir-a .sh .n{margin-left:auto}
.dir-a .sh.today{color:var(--acc)}
/* card */
.dir-a .card{margin:0 16px 12px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px}
.dir-a .ctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dir-a .mono{width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.dir-a .mono .ms{font-size:18px}
.dir-a .chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.dir-a .chip .ms{font-size:16px}
.dir-a .chip.today{background:var(--acc);color:#fff}
.dir-a .ph.dark .chip.today{color:#1B1A17}
.dir-a .chip.urgent{background:var(--accC);color:var(--onAccC)}
.dir-a .chip.soon,.dir-a .chip.calm{background:var(--sunk);color:var(--ink)}
.dir-a .chip.ok{background:var(--okC);color:var(--ok)}
.dir-a .chip.q{background:var(--qC);color:var(--q)}
.dir-a .facts{display:flex;margin:12px 0;border-radius:14px;background:var(--sunk)}
.dir-a .facts div{flex:1;padding:8px 12px}
.dir-a .facts div+div{box-shadow:-1px 0 0 var(--hair)}
.dir-a .facts b{display:block;font-size:15px;line-height:22px;font-weight:600}
.dir-a .rule{display:flex;gap:6px;align-items:flex-start}
.dir-a .rule .ms{font-size:18px;margin-top:2px}
.dir-a .rule.ok .ms{color:var(--ok)}
.dir-a .rule.q .ms{color:var(--q)}
.dir-a .acts{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;box-shadow:0 -1px 0 var(--hair)}
.dir-a .btn{height:48px;border-radius:14px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}
.dir-a .btn .ms{font-size:20px}
.dir-a .btn.ink{background:var(--cta);color:var(--onCta);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 16px -6px rgba(27,26,23,.45)}
.dir-a .btn.sm{height:40px;border-radius:12px;padding:0 14px}
.dir-a .btn.ghost{color:var(--ink);background:var(--sunk)}
.dir-a .btn.line{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);background:var(--card)}
.dir-a .btn.full{width:100%}
/* compact later rows */
.dir-a .lrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.dir-a .lrow+.lrow{box-shadow:0 -1px 0 var(--hair)}
.dir-a .when{width:52px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--sunk);padding:6px 0}
.dir-a .when b{display:block;font-size:22px;line-height:26px;font-weight:600}
.dir-a .when span{font-size:12px;line-height:16px;color:var(--mut)}
/* ad */
.dir-a .ad{margin:4px 16px 12px;border-radius:16px;border:1px dashed var(--hair);padding:12px;display:flex;gap:12px;align-items:center;background:transparent}
.dir-a .adl{font-size:12px;line-height:16px;font-weight:600;color:var(--mut);border:1px solid var(--hair);border-radius:6px;padding:1px 6px}
.dir-a .adimg{width:44px;height:44px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--mut)}
.dir-a .disc{display:flex;gap:8px;align-items:flex-start;margin:4px 20px 16px;color:var(--mut)}
.dir-a .disc .ms{font-size:18px;margin-top:1px}
/* bottom nav */
.dir-a .nav{height:80px;display:flex;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--hair)}
.dir-a .nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);position:relative;font-size:13px;line-height:18px}
.dir-a .nav .on{color:var(--ink);font-weight:600}
.dir-a .nav .pill{width:56px;height:32px;border-radius:999px;display:grid;place-items:center;position:relative}
.dir-a .nav .on .pill{background:var(--sunk)}
.dir-a .nav .bdg{position:absolute;top:-2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.dir-a .ph.dark .nav .bdg{color:#1B1A17}
/* detail */
.dir-a .hero{margin:4px 16px 12px}
.dir-a .count{display:flex;align-items:center;gap:16px;margin:16px 0 0;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--sh)}
.dir-a .count .big{font-size:32px;line-height:40px;font-weight:600;color:var(--acc);letter-spacing:-.02em}
.dir-a .count .lbl{color:var(--acc);font-weight:600}
.dir-a .count .sep{width:1px;align-self:stretch;background:var(--hair)}
.dir-a .chg{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--qC);color:var(--q)}
.dir-a .chg .ms{font-size:18px}
.dir-a .ctitle{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dir-a .ctitle .ms{font-size:20px;color:var(--mut)}
.dir-a .wl{display:flex;gap:10px;padding:8px 0}
.dir-a .wl+.wl{box-shadow:0 -1px 0 var(--hair)}
.dir-a .wl .ms{font-size:20px;margin-top:1px}
.dir-a .wl.ok .ms{color:var(--ok)}
.dir-a .wl.q .ms{color:var(--q)}
.dir-a .tl{position:relative;padding-left:22px}
.dir-a .tl:before{content:'';position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:var(--hair);border-radius:1px}
.dir-a .tli{position:relative;display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.dir-a .tli:before{content:'';position:absolute;left:-22px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--hair)}
.dir-a .tli.past{color:var(--mut)}
.dir-a .tli.past:before{background:var(--hair);box-shadow:none}
.dir-a .tli.key:before{background:var(--acc);box-shadow:0 0 0 4px var(--accC)}
.dir-a .tli.key{color:var(--acc);font-weight:600}
.dir-a .abar{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 16px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--hair)}
.dir-a .abar .ni{display:flex;justify-content:center;align-items:center;gap:6px;height:40px;color:var(--mut);font-size:13px;font-weight:600}
.dir-a .abar .ni .ms{font-size:18px}
.dir-a .spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dir-a .spec div{background:var(--sunk);border-radius:12px;padding:8px 12px}
.dir-a .spec b{display:block;font-size:15px;line-height:22px;font-weight:600}
.dir-a .chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.dir-a .box{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--mut);display:grid;place-items:center;flex-shrink:0}
.dir-a .box.on{background:var(--ink);box-shadow:none;color:var(--bg)}
.dir-a .box .ms{font-size:16px}
.dir-a .chk.on span:last-child{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--hair)}
.dir-a .lnk{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px}
.dir-a .lnk+.lnk{box-shadow:0 -1px 0 var(--hair)}
.dir-a .lnk .mono{width:40px;height:40px;border-radius:12px}
.dir-a .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:8px 0 4px}
.dir-a .bar i{display:block;height:100%;width:50%;background:var(--ok);border-radius:3px}
.dir-a .dv{height:1px;background:var(--hair);margin:14px 0}
/* tracker */
.dir-a .seg{display:flex;margin:12px 20px 0;padding:4px;border-radius:14px;background:var(--sunk)}
.dir-a .seg div{flex:1;height:40px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--mut)}
.dir-a .seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(70,50,20,.1)}
.dir-a .upsell{margin:12px 16px;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;background:var(--pro);color:var(--onPro);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 20px -8px rgba(27,26,23,.5)}
.dir-a .upsell .ms{color:#D9B77A}
.dir-a .upsell .pp{margin-left:auto;height:36px;padding:0 12px;border-radius:10px;background:#D9B77A;color:#1B1A17;font-size:13px;font-weight:600;display:grid;place-items:center;white-space:nowrap}
.dir-a .stage{display:flex;gap:12px;position:relative;padding-bottom:10px}
.dir-a .stage .nd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--sunk);color:var(--mut);position:relative;z-index:1}
.dir-a .stage .nd .ms{font-size:16px}
.dir-a .stage:not(:last-child):after{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--hair)}
.dir-a .stage.done .nd{background:var(--ok);color:#fff}
.dir-a .ph.dark .stage.done .nd{color:#12110F}
.dir-a .stage.done:after{background:var(--ok)!important}
.dir-a .stage.next .nd{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dir-a .stage.locked{color:var(--mut)}
.dir-a .stage .lk{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--brass);font-size:12px;font-weight:600;white-space:nowrap}
.dir-a .stage .lk .ms{font-size:14px}
.dir-a .status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sunk);margin:12px 0}
/* paywall */
.dir-a .peak{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 24px 20px}
.dir-a .halo{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--okC) 55%,transparent 56%),radial-gradient(circle,rgba(47,107,79,.10) 0,rgba(47,107,79,0) 70%);margin-bottom:12px;position:relative}
.dir-a .halo:before{content:'';position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 0 1px var(--okC)}
.dir-a .halo b{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px rgba(47,107,79,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.dir-a .ph.dark .halo b{color:#12110F}
.dir-a .halo .ms{font-size:32px}
.dir-a .procard{margin:0 12px;border-radius:24px;padding:20px;background:var(--pro);color:var(--onPro);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 40px -16px rgba(27,26,23,.55)}
.dir-a .procard .mut{color:var(--proMut)}
.dir-a .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#D9B77A;border:1px solid rgba(217,183,122,.4);border-radius:999px;padding:2px 8px}
.dir-a .tag .ms{font-size:14px}
.dir-a .ben{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.dir-a .ben .ms{font-size:18px;color:#D9B77A;margin-top:2px}
.dir-a .plans{display:flex;gap:8px;margin:14px 0 12px}
.dir-a .plan{flex:1;border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);position:relative}
.dir-a .plan.sel{box-shadow:inset 0 0 0 2px #D9B77A;background:rgba(217,183,122,.08)}
.dir-a .plan .pr{font-size:22px;line-height:28px;font-weight:600}
.dir-a .plan .bd{position:absolute;top:-10px;right:10px;background:#D9B77A;color:#1B1A17;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.dir-a .btn.brass{background:linear-gradient(180deg,#E6C98F,#D2AC67);color:#1B1A17;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -8px rgba(217,183,122,.7)}
.dir-a .btn.ol{color:var(--onPro);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}

body{background:#E7E5E1;font-family:Inter,system-ui,sans-serif;min-width:0}
.ovh{font:600 28px/1.2 Inter,system-ui;margin:0 0 6px;color:#1B1A17}.ovs{font:400 16px/1.5 Inter;color:#55504A;margin-bottom:32px}
.ov{display:flex;gap:48px}.ov>div{display:flex;flex-direction:column;gap:16px}
.ovl{font:600 18px/1.3 Inter;color:#1B1A17}.ovl span{display:block;font:400 14px/1.4 Inter;color:#55504A;max-width:376px}
