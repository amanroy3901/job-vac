# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Locales shipped in this build (comma-separated). Must match app/src/main/res/xml/locales_config.xml.
sm.enabledLocales=hi,en

# API base URLs (placeholder domain; docs/api/README.md §1)
sm.apiBaseUrl.prod=https://api.sarkarimatch.in/
sm.apiBaseUrl.staging=https://api-staging.sarkarimatch.in/
