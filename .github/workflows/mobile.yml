name: mobile

# Kotlin Multiplatform + Compose Multiplatform app (mobile/): Android on Linux, iOS on macOS.
on:
  pull_request:
    paths: ['mobile/**', 'docs/backend/examples/**', 'docs/design/tokens.json', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'docs/backend/examples/**', 'docs/design/tokens.json', '.github/workflows/mobile.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Android build, JVM/Android unit tests, detekt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); this accepts licences and adds missing platforms.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pure KMP modules on the JVM (models, on-device eligibility evaluator)
        run: ./gradlew :core:model:jvmTest :core:eligibility:jvmTest

      - name: commonTest on the Android host (tokens parity, API client, reminders, feed grouping)
        run: ./gradlew :core:designsystem:testAndroidHostTest :core:data:testAndroidHostTest :composeApp:testAndroidHostTest

      - name: Static analysis
        run: ./gradlew detekt

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleProdDebug

      - name: Bundled font budget (i18n-and-design-system.md, 450 KB)
        run: |
          size=$(cat core/designsystem/src/commonMain/composeResources/font/*.ttf | wc -c)
          echo "bundled fonts: $size bytes"
          if [ "$size" -gt 460800 ]; then echo "::warning::bundled fonts are $size bytes, over the 450 KB budget"; fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: mobile/**/build/reports/**

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-prod-debug
          path: mobile/androidApp/build/outputs/apk/prod/debug/*.apk
          retention-days: 7

  ios:
    name: iOS framework, iOS simulator tests, Xcode build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native toolchain (~/.konan) is downloaded by the Kotlin Gradle plugin on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}

      - name: Link the ComposeApp framework (iOS simulator, arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: commonTest on the iOS simulator
        run: >
          ./gradlew :core:model:iosSimulatorArm64Test :core:eligibility:iosSimulatorArm64Test
          :core:designsystem:iosSimulatorArm64Test :core:data:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Xcode build (iOS simulator, unsigned)
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-reports
          path: mobile/**/build/reports/**
